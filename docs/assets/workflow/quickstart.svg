<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="545" viewBox="0 0 1400 545" role="img"><title>Describe. Run. Open.</title><desc>Agentic CAD  /  from your terminal or coding agent</desc><rect width="1400" height="545" fill="#f7f7f7"/>
<text x="48" y="65" font-family="Arial,sans-serif" font-size="34" fill="#242424">Describe. Run. Open.</text>
<text x="48" y="103" font-family="Arial,sans-serif" font-size="20" fill="#696969">Agentic CAD  /  from your terminal or coding agent</text>
<rect x="48" y="152" width="380" height="268" rx="5" fill="#ffffff" stroke="#dedede"/>
<rect x="476" y="152" width="450" height="268" rx="5" fill="#ffffff" stroke="#dedede"/>
<rect x="974" y="152" width="378" height="268" rx="5" fill="#ffffff" stroke="#dedede"/>
<text x="70" y="195" font-family="Arial,sans-serif" font-size="24" fill="#242424">1  Supply the inputs</text>
<text x="70" y="244" font-family="Arial,sans-serif" font-size="20" fill="#242424">Describe one object</text>
<text x="70" y="280" font-family="Arial,sans-serif" font-size="20" fill="#242424">Add 0–16 reference photos</text>
<text x="70" y="316" font-family="Arial,sans-serif" font-size="20" fill="#242424">Include known dimensions</text>
<text x="70" y="384" font-family="Arial,sans-serif" font-size="17" fill="#696969">Text-only works too.</text>
<text x="498" y="195" font-family="Arial,sans-serif" font-size="24" fill="#242424">2  Run Agentic CAD</text>
<text x="498" y="238" font-family="Consolas,monospace" font-size="17" fill="#242424">agentic-cad reconstruct photos/ \</text>
<text x="498" y="267" font-family="Consolas,monospace" font-size="16" fill="#242424">  --prompt &quot;Reconstruct this bracket&quot; \</text>
<text x="498" y="296" font-family="Consolas,monospace" font-size="16" fill="#242424">  --dimension &quot;height=60mm&quot; \</text>
<text x="498" y="325" font-family="Consolas,monospace" font-size="17" fill="#242424">  --output work/bracket</text>
<image x="498" y="355" width="100" height="24" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
<text x="620" y="374" font-family="Arial,sans-serif" font-size="17" fill="#696969">Code can run this CLI.</text>
<text x="996" y="195" font-family="Arial,sans-serif" font-size="24" fill="#242424">3  Open the result</text>
<text x="996" y="249" font-family="Consolas,monospace" font-size="19" fill="#242424">work/bracket/viewer.html</text>
<text x="996" y="294" font-family="Arial,sans-serif" font-size="18" fill="#242424">Inspect dimensions and shape</text>
<text x="996" y="329" font-family="Arial,sans-serif" font-size="18" fill="#242424">Download STEP or STL</text>
<text x="996" y="384" font-family="Arial,sans-serif" font-size="17" fill="#696969">Or open model.step in CAD.</text>
<path d="M439 287 l25 0 m-6 -5 6 5 -6 5" fill="none" stroke="#898989" stroke-width="1.5"/>
<path d="M936 287 l26 0 m-6 -5 6 5 -6 5" fill="none" stroke="#898989" stroke-width="1.5"/>
<text x="48" y="478" font-family="Arial,sans-serif" font-size="19" fill="#242424">Change a dimension locally</text>
<text x="393" y="478" font-family="Consolas,monospace" font-size="18" fill="#242424">agentic-cad edit work/bracket --set width=80 --output work/bracket-80</text>
<text x="48" y="518" font-family="Arial,sans-serif" font-size="17" fill="#696969">CLI + Python today. Claude Code calls the CLI directly; MCP is not required.</text>
</svg>