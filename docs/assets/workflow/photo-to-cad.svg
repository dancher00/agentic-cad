<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="890" viewBox="0 0 1400 890">
<rect width="1400" height="890" fill="#f7f7f6"/>
<style>text{font-family:Arial,sans-serif;fill:#292c2b}.muted{fill:#777c78}.box{fill:#eeefec;stroke:#d4d7d1}</style>
<text x="60" y="74" font-size="38" fill="#292c2b">Datumfold</text>
<text x="60" y="113" font-size="22" fill="#292c2b">From a description and reference views to editable CAD</text>
<text x="60" y="181" font-size="16" fill="#292c2b">01   MODEL + LOCAL TOOLS</text>
<rect class="box" x="60" y="208" width="275" height="156" rx="14"/>
<text x="82" y="247" font-size="25" fill="#292c2b">Describe</text>
<text x="82" y="290" font-size="19" fill="#292c2b">Text + 0–16 photos</text>
<text x="82" y="325" font-size="16" fill="#292c2b">Known dimensions</text>
<path d="M346,286 h36 m-7,-5 l7,5 -7,5" fill="none" stroke="#838881" stroke-width="2"/>
<rect class="box" x="395" y="208" width="275" height="156" rx="14"/>
<text x="417" y="247" font-size="25" fill="#292c2b">Generate</text>
<text x="417" y="290" font-size="19" fill="#292c2b">GPT-5.6 Sol</text>
<text x="417" y="325" font-size="16" fill="#292c2b">Structured CAD response</text>
<path d="M681,286 h36 m-7,-5 l7,5 -7,5" fill="none" stroke="#838881" stroke-width="2"/>
<rect class="box" x="730" y="208" width="275" height="156" rx="14"/>
<text x="752" y="247" font-size="25" fill="#292c2b">Build</text>
<text x="752" y="290" font-size="19" fill="#292c2b">Restricted CadQuery</text>
<text x="752" y="325" font-size="16" fill="#292c2b">OpenCascade solid check</text>
<path d="M1016,286 h36 m-7,-5 l7,5 -7,5" fill="none" stroke="#838881" stroke-width="2"/>
<rect class="box" x="1065" y="208" width="275" height="156" rx="14"/>
<text x="1087" y="247" font-size="25" fill="#292c2b">Export</text>
<text x="1087" y="290" font-size="19" fill="#292c2b">STEP · STL · Python</text>
<text x="1087" y="325" font-size="16" fill="#292c2b">Offline CAD workspace</text>
<text x="395" y="401" font-size="17" fill="#292c2b">Invalid code → one bounded repair request to GPT</text>
<path d="M870 375 v45 H530 v-45" fill="none" stroke="#bec2ba" stroke-dasharray="5 5"/>
<text x="60" y="493" font-size="16" fill="#292c2b">02   THE DATA AT EACH STEP</text>
<rect class="box" x="60" y="520" width="386" height="238" rx="14"/>
<rect class="box" x="507" y="520" width="386" height="238" rx="14"/>
<rect class="box" x="954" y="520" width="386" height="238" rx="14"/>
<text x="82" y="560" font-size="15" fill="#292c2b">INPUT</text>
<text x="82" y="605" font-size="21" fill="#292c2b">“Reconstruct this bracket.”</text>
<text x="82" y="642" font-size="17" fill="#292c2b">Front · side · rear · opposite side</text>
<text x="82" y="682" font-size="19" fill="#292c2b">Known height: 60 mm</text>
<text x="82" y="725" font-size="16" fill="#292c2b">Photos optional for text-only parts</text>
<text x="529" y="560" font-size="15" fill="#292c2b">INTERMEDIATE</text>
<text x="529" y="605" font-size="23" fill="#292c2b">PARAMETERS = { ... }</text>
<text x="529" y="645" font-size="22" fill="#292c2b">r = cq.Workplane(...)</text>
<text x="529" y="685" font-size="20" fill="#292c2b">    .extrude(...).cut(...)</text>
<text x="529" y="725" font-size="16" fill="#292c2b">Dimensions + geometric assumptions</text>
<text x="976" y="560" font-size="15" fill="#292c2b">OUTPUT</text>
<text x="976" y="605" font-size="26" fill="#292c2b">model.step</text>
<text x="976" y="645" font-size="22" fill="#292c2b">model.stl + model.py</text>
<text x="976" y="685" font-size="19" fill="#292c2b">parameters.json + viewer.html</text>
<text x="976" y="725" font-size="16" fill="#292c2b">One editable, kernel-valid solid</text>
<path d="M457,640 h38 m-7,-5 l7,5 -7,5" fill="none" stroke="#838881" stroke-width="2"/>
<path d="M904,640 h38 m-7,-5 l7,5 -7,5" fill="none" stroke="#838881" stroke-width="2"/>
<text x="60" y="816" font-size="19" fill="#292c2b">GPT generates geometry. CAD execution and export stay local.</text>
<text x="60" y="849" font-size="17" fill="#292c2b">Material assignment, FEM simulation and grasp planning remain downstream.</text>
</svg>