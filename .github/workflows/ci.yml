name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints/cpu-py312.txt
      - name: Install locked CPU environment
        run: |
          python -m pip install -r constraints/cpu-py312.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Formatting
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Types
        run: mypy
      - name: CPU tests (no weights, no network)
        env:
          DA3_CAD_TEST_NO_NETWORK: "1"
        run: pytest -m 'not gpu and not weights and not benchmark'
      - name: Public release hygiene
        run: python scripts/check_release.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Inspect distributions
        run: |
          python -m zipfile --list dist/*.whl
          python -m pip install --no-deps --force-reinstall dist/*.whl
          da3-cad --version
