[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "da3-cad"
version = "0.1.0"
description = "Research pipeline for multi-view RGB to editable parametric CAD"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{name = "DA3-CAD contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cadquery==2.4.0",
  "nlopt==2.7.1",
  "numpy>=1.26.4,<2",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "trimesh>=4.9,<5",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pip-tools>=7.6,<8",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0.12,<7",
]
gpu = [
  "torch>=2.13,<2.14",
  "torchvision>=0.28,<0.29",
]
da3 = [
  "addict==2.4.0",
  "einops>=0.8,<1",
  "evo>=1.37,<2",
  "huggingface-hub>=0.36,<1",
  "omegaconf>=2.3,<3",
  "opencv-python-headless==4.11.0.86",
  "safetensors>=0.6,<1",
  "scipy>=1.16,<1.17",
]

[project.scripts]
da3-cad = "da3_cad.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
da3_cad = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA GPU",
  "weights: requires downloaded third-party weights",
  "benchmark: long-running benchmark contract test",
  "external_data: requires explicitly accepted non-redistributed dataset files",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
packages = ["da3_cad"]

[[tool.mypy.overrides]]
module = ["cadquery.*", "trimesh.*", "yaml.*"]
ignore_missing_imports = true
