[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "da3-cad"
version = "0.4.0"
description = "Deterministic multi-view RGB to editable B-Rep CAD with Depth Anything 3"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{name = "DA3-CAD contributors"}]
keywords = ["cad", "depth-anything-3", "3d-reconstruction", "cad-grammar", "cadquery"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "cadquery==2.4.0",
  "nlopt==2.7.1",
  "manifold3d==3.5.2",
  "numpy>=1.26.4,<2",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "scipy>=1.16,<1.17",
  "trimesh>=4.9,<5",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
photo = [
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "transformers>=4.56,<4.57",
  "huggingface-hub>=0.36,<1",
  "opencv-python-headless==4.11.0.86",
  "hydra-core==1.3.2",
  "iopath==0.1.10",
]

dev = [
  "point-cloud-utils>=0.34,<0.35",
  "protobuf>=6.31.1,<7",
  "opencv-python-headless==4.11.0.86",
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pip-tools>=7.6,<8",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0.12,<7",
]
gpu = [
  "torch>=2.13,<2.14",
  "torchvision>=0.28,<0.29",
]
da3 = [
  "addict==2.4.0",
  "einops>=0.8,<1",
  "evo>=1.37,<2",
  "huggingface-hub>=0.36,<1",
  "omegaconf>=2.3,<3",
  "opencv-python-headless==4.11.0.86",
  "safetensors>=0.6,<1",
]
video = [
  "opencv-python-headless==4.11.0.86",
  "pycolmap>=4.1.1,<4.2",
]
dense = [
  "open3d>=0.19,<0.20",
]
ray = [
  "torch>=2.6,<3",
  "opencv-python-headless==4.11.0.86",
]
cadena = [
  "point-cloud-utils>=0.34,<0.35",
  "pykdtree>=1.4,<2",
  "pyvista>=0.46,<0.47",
  "qwen-vl-utils>=0.0.10,<0.1",
  "transformers>=4.56,<4.57",
  "vtk>=9.5,<9.6",
]
target = [
  "hydra-core==1.3.2",
  "iopath==0.1.10",
  "protobuf>=6.31,<7",
]
reports = [
  "weasyprint==69.0",
]
[project.urls]
Homepage = "https://github.com/dancher00/DA3-CAD"
Documentation = "https://github.com/dancher00/DA3-CAD#readme"
Repository = "https://github.com/dancher00/DA3-CAD.git"
Issues = "https://github.com/dancher00/DA3-CAD/issues"

[project.scripts]
da3-cad = "da3_cad.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
da3_cad = ["py.typed", "viewer/*.html", "*.proto"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA GPU",
  "weights: requires downloaded third-party weights",
  "benchmark: long-running benchmark contract test",
  "external_data: requires explicitly accepted non-redistributed dataset files",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
packages = ["da3_cad"]

[[tool.mypy.overrides]]
module = ["cadquery.*", "open3d.*", "scipy.*", "trimesh.*", "yaml.*"]
ignore_missing_imports = true

# Optional integrations are absent from the minimal CPU environment.
[[tool.mypy.overrides]]
module = ["torch.*", "cv2.*", "pycolmap.*", "huggingface_hub.*", "transformers.*", "point_cloud_utils.*"]
ignore_missing_imports = true
